# Smoke config -- the tiny end-to-end pipeline test.
#
# One small target, two conditions, 20 prompts, 1 repeat, max_tokens 32. Small enough to
# finish in minutes, real enough that every record is a genuine measurement.
instance: smoke
platform: h100
stack: vllm
log_path: logs/smoke.jsonl

# Draft and target MUST share a vocabulary. vLLM rejects a mismatched pair outright
# ("Target and draft model should have the same vocabulary size"), and it is right to:
# speculative decoding indexes the target's logits with the draft's token ids, so a
# different tokenizer is an out-of-bounds read, not merely a low acceptance rate.
#
# Llama-3.2 3B and 1B share the Llama-3 tokenizer (vocab 128256), which also makes this
# the same draft_model code path the real sweeps use.
model:
  - target_model: meta-llama/Llama-3.2-3B-Instruct
    draft_model: meta-llama/Llama-3.2-1B-Instruct

prompts:
  source: gsm8k
  split: test
  n: 20
  seed: 0
  # Deliberately a slice of the frozen 250-question exam: this is a pipeline test, not a
  # quality measurement. Real sweep configs must never set this.
  allow_partial: true

defaults:
  max_tokens: 32
  ignore_eos: true
  temperature: 0.0
  seed: 42
  repeats: 1
  warmup: 1
  batch_size: 1
  target_dtype: bf16
  gpu_memory_utilization: 0.80

axes:
  spec:
    - {spec_method: none, num_speculative_tokens: null}
    - {spec_method: draft_model, num_speculative_tokens: 4}

interleave: true
