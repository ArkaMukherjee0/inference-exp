# Local CPU arm -- E6 (the platform curve).
#
# Core Ultra 7 270K Plus. num_threads is mandatory and pinned: on a hybrid P/E-core part
# an unbounded thread count lets the scheduler migrate work between core types mid-run,
# and the timings wander for reasons that have nothing to do with the model.
#
# Set num_threads to the P-core count, not the logical core count -- mixing P and E cores
# in one inference pool measures the slowest core, not the machine.
instance: local-cpu
platform: cpu
stack: llamacpp
log_path: logs/local-cpu.jsonl

model:
  # llama.cpp b10655, built from source with per-step acceptance logging added to
  # examples/speculative (patches/llamacpp-b10655-per-step-accept.patch). The stock
  # release archives ship no speculative binary at all, and the stock example prints
  # only aggregate acceptance -- no accepted-run-length distribution.
  binary: 'C:\tools\llama.cpp-src\build\bin\llama-speculative.exe'
  # The speculative example requires a draft model, so it cannot measure the
  # non-speculative baseline. Same build, same flags -- a baseline from a different
  # build would put the build difference into the speedup.
  baseline_binary: 'C:\tools\llama.cpp-src\build\bin\llama-completion.exe'
  # -c: the default context is the model's full 131072 tokens, which asks for a 16 GiB
  # KV cache and fails to allocate before a single token is generated.
  extra_args: ['-c', '4096']
  # llama-completion turns on conversation mode for any model with a chat template,
  # which would wrap every prompt and block on stdin. The speculative example has no
  # such mode and rejects the flag, so it is baseline-only.
  baseline_extra_args: ['-no-cnv']
  target_gguf: 'C:\models\lmstudio-community\Meta-Llama-3.1-8B-Instruct-GGUF\Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf'
  draft_gguf: 'C:\models\lmstudio-community\Llama-3.2-1B-Instruct-GGUF\Llama-3.2-1B-Instruct-Q4_K_M.gguf'
  target_model: Llama-3.1-8B-Instruct-Q4_K_M
  draft_model: Llama-3.2-1B-Instruct-Q4_K_M

prompts:
  source: gsm8k
  split: test
  n: 80
  seed: 0
  # Sized to a 12-hour budget: 80 of the frozen 250-question exam, taken as a
  # deterministic prefix so BOTH arms and every condition score the identical 80.
  # The full exam stays frozen and committed; this narrows what was run, not what
  # was chosen. Interval width scales ~sqrt(250/80) ~ 1.8x wider than the full set.
  allow_partial: true

defaults:
  max_tokens: 256
  ignore_eos: true
  temperature: 0.0
  seed: 42
  repeats: 3
  warmup: 3
  target_dtype: w4a16
  batch_size: 1
  num_threads: 8
  gguf_quant: Q4_K_M

axes:
  spec:
    - {spec_method: none, num_speculative_tokens: null}
    - {spec_method: draft_model, num_speculative_tokens: 1}
    - {spec_method: draft_model, num_speculative_tokens: 2}
    - {spec_method: draft_model, num_speculative_tokens: 3}
    - {spec_method: draft_model, num_speculative_tokens: 4}

interleave: true
