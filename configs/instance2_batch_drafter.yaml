# Instance 2 -- E3 (batch-size collapse), E4 (drafter methods), E8 (dense vs MoE).
#
# Gamma is pinned at the E2 optimum so the batch axis is not confounded with the gamma
# axis. Write the chosen value here explicitly once E2 has run; do not leave it implicit.
instance: instance-2
platform: h100
stack: vllm
log_path: logs/instance-2.jsonl

model:
  - target_model: meta-llama/Llama-3.1-8B-Instruct
    draft_model: meta-llama/Llama-3.2-1B-Instruct
  - target_model: mistralai/Mixtral-8x7B-Instruct-v0.1
    draft_model: mistralai/Mistral-7B-Instruct-v0.2

prompts:
  source: gsm8k
  split: test
  n: 250
  seed: 0

defaults:
  max_tokens: 256
  ignore_eos: true
  temperature: 0.0
  seed: 42
  repeats: 5
  warmup: 3
  target_dtype: bf16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85

axes:
  batch_size: [1, 2, 4, 8, 16, 32, 64]
  spec:
    - {spec_method: none, num_speculative_tokens: null}
    - {spec_method: draft_model, num_speculative_tokens: 4}

interleave: true
