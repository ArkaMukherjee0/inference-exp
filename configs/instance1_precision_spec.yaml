# Instance 1 -- E1 (composition) and E2 (gamma sweep vs the analytical model).
# The headline experiment: does speculative speedup survive lower precision?
#
# Each precision level needs its own checkpoint, because fp8 and w4a16 are properties of
# the weights on disk, not runtime flags. The runner verifies that what vLLM resolved
# matches what is claimed here and refuses to proceed if it does not.
instance: instance-1
platform: h100
stack: vllm
log_path: logs/instance-1.jsonl

# Only the drafter lives here. The target checkpoint moves with the precision axis
# below, because fp8 and w4a16 are properties of the weights on disk -- not runtime
# flags -- so each precision is a different checkpoint of the same model.
#
# The drafter stays BF16 throughout: quantizing the draft model would add a second
# precision variable to an experiment about the target's precision.
model:
  - draft_model: meta-llama/Llama-3.2-1B-Instruct

prompts:
  source: gsm8k
  split: test
  n: 80
  seed: 0
  # Sized to a 12-hour budget: 80 of the frozen 250-question exam, taken as a
  # deterministic prefix so BOTH arms and every condition score the identical 80.
  # The full exam stays frozen and committed; this narrows what was run, not what
  # was chosen. Interval width scales ~sqrt(250/80) ~ 1.8x wider than the full set.
  allow_partial: true

defaults:
  max_tokens: 256
  ignore_eos: true
  temperature: 0.0
  seed: 42
  repeats: 3
  warmup: 3
  batch_size: 1
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85

axes:
  # Grouped axis: target_dtype and target_model move together, one checkpoint per
  # precision. VERIFY these three repo ids resolve before launching -- the runner reads
  # back what vLLM actually loaded and refuses to record a BF16 run as fp8, so a wrong
  # id here fails loudly at startup rather than silently in the results.
  precision:
    - {target_dtype: bf16,  target_model: meta-llama/Llama-3.1-8B-Instruct}
    - {target_dtype: fp8,   target_model: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8}
    - {target_dtype: w4a16, target_model: RedHatAI/Meta-Llama-3.1-8B-Instruct-quantized.w4a16}
  # The gamma range has to bracket the optimum, not stop short of it. Acceptance measured
  # on this exact pair (Llama-3.1-8B target, Llama-3.2-1B draft) is alpha ~= 0.92 at
  # gamma=1 and ~= 0.88 at gamma=2; feeding that to analysis.model.optimal_gamma gives a
  # predicted optimum of 7-10 for any plausible c in [0.10, 0.20]. A sweep that stopped at
  # gamma=4 would sit entirely on the rising limb, and E2 -- which exists to locate the
  # turnover and compare it against the analytical prediction -- would have nothing to
  # locate. Figure 04 needs points on both sides of the peak.
  spec:
    - {spec_method: none, num_speculative_tokens: null}
    - {spec_method: draft_model, num_speculative_tokens: 1}
    - {spec_method: draft_model, num_speculative_tokens: 2}
    - {spec_method: draft_model, num_speculative_tokens: 3}
    - {spec_method: draft_model, num_speculative_tokens: 4}
    - {spec_method: draft_model, num_speculative_tokens: 5}
    - {spec_method: draft_model, num_speculative_tokens: 7}
    - {spec_method: draft_model, num_speculative_tokens: 10}

# Insurance, not a preference. If this vLLM build's acceptance statistics still cannot
# be reconciled with the tokens emitted, speculative records are written speed-valid and
# acceptance-null, stamped acceptance_unavailable, rather than the sweep dying overnight.
# Figures 01/02/03/05 are unaffected; 04 and 06 then come from the CPU arm, where
# llama.cpp's per-step logging works. A histogram is never invented either way.
allow_missing_acceptance: true

interleave: true
